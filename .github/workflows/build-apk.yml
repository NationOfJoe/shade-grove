name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build signed release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SunwardGrove-${{ github.run_number }}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunwardGrove-apk
          path: SunwardGrove-${{ github.run_number }}.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sunward Grove build ${{ github.run_number }}
          body: Install SunwardGrove-${{ github.run_number }}.apk on your Android phone. Each build installs over the previous one.
          files: SunwardGrove-${{ github.run_number }}.apk
          make_latest: true
